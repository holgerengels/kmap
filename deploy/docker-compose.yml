version: "3.8"

services:
  kmap-mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
    networks:
      kmap:
        aliases:
          - mongodb
          - kmap-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "127.0.0.1:27017:27017"

  kmap-server:
    image: ghcr.io/holgerengels/kmap-server:latest
    restart: unless-stopped
    environment:
      JAVA_OPTIONS: "-Djavax.net.ssl.trustStore=/config/trustStore -Djavax.net.ssl.trustStorePassword=changeit"
    volumes:
      # config.json (section "server"), trustStore, <instance>-users.csv
      - ./config:/config:ro
    networks:
      kmap:
        aliases:
          - jetty
          - server
          - kmap-server
    depends_on:
      - kmap-mongodb
    ports:
      - "127.0.0.1:8080:8080"

  kmap-frontend:
    image: ghcr.io/holgerengels/kmap-frontend:latest
    restart: unless-stopped
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      kmap:
        aliases:
          - nginx
          - frontend
          - kmap-frontend
    depends_on:
      - kmap-server
    ports:
      - "80:80"
      - "443:443"

  kmap-snappy:
    image: ghcr.io/holgerengels/kmap-snappy:latest
    restart: unless-stopped
    volumes:
      # config.json (section "snappy")
      - ./config:/config:ro
      - snappy:/opt/snappy/snaps
    networks:
      kmap:
        aliases:
          - snappy
          - kmap-snappy
    depends_on:
      - kmap-server
      - kmap-mongodb
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "kmap.eu:host-gateway"

volumes:
  mongodb:
    name: kmap_mongodb
  snappy:
    name: kmap_snappy

networks:
  kmap:
    name: kmap
