<!doctype html>
<html lang="de">
<head>
    <title>Zahlenstrahl</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraph.css'/>
    <script src='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraphcore.js' type='text/javascript'></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr;
        }
        .jxgbox { border-radius: 0px; border: none}
        .term {
            background-color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div id='board' class='jxgbox' style='width: 100%; aspect-ratio: 4'></div>
</div>

<script>
    var board = JXG.JSXGraph.initBoard('board', { boundingbox: [-4, 1.5, 4, -.5], axis: false, showNavigation: false, showZoom: false, showCopyright: false, pan: { enabled: false }});
    var xAxis = board.create('axis', [[0, 0], [1, 0]], {
        ticks: {
            drawLabels: true,
            ticksDistance: 1,
            minorTicks: 0,
            majorHeight: 10,
            label: { offset: [0, -15], fontSize: 14 },
            drawZero: true
        }
    });
    // Leere Quadrate über den Zahlen -3, -2, -1, 0, 1, 2, 3 zeichnen
    const squareSize = 0.4;      // Kantenlänge der Quadrate in User-Koordinaten
    const squareYBase = 0.2;     // Y-Position der Unterkante der Quadrate

    const squares = [-3, -1, -.5, 0, .5, 1, 2, 3];
    const names = ['d', 'a', 'b', 'f', 'g', 'h', 'e', 'c'];

    squares.forEach((xValue, i) => {
        const bottomLeft = [xValue - squareSize / 2, squareYBase];
        const bottomRight = [xValue + squareSize / 2, squareYBase];
        const topRight = [xValue + squareSize / 2, squareYBase + squareSize];
        const topLeft = [xValue - squareSize / 2, squareYBase + squareSize];

        board.create('polygon', [bottomLeft, bottomRight, topRight, topLeft], {
            fillColor: 'white',       // Füllfarbe (kann auch 'transparent' sein)
            fillOpacity: 0,           // Macht die Füllung unsichtbar (wichtig für "leer")
            strokeColor: 'black',     // Randfarbe der Quadrate
            strokeWidth: 1,           // Randbreite
            vertices: { visible: false }, // Macht die Eckpunkte unsichtbar
            fixed: true               // Macht die Quadrate nicht interaktiv
        });
        board.create('text', [xValue, .3, names[i]], { anchorX: 'middle', anchorY: 'bottom', fontSize: 14 });
    });
;
</script>

</body>
</html>
