<!doctype html>
<html lang="de">
<head>
    <title>Quadratische Funktion - Scheitelpunktform</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraph.css'/>
    <script src='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraphcore.js' type='text/javascript'></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr;
            position: relative;
        }
        .jxgbox { border-radius: 0px; border: none}
    </style>
</head>
<body>

<div class="container">
    <div id='board' class='jxgbox' style='width: 100%; aspect-ratio: 1'></div>
</div>

<script>
    const plusminus = val => val < 0 ? "- " + (-val) : "+ " + val;

    var board = JXG.JSXGraph.initBoard('board', {boundingbox: [-5, 5, 5, -5], axis: true, showNavigation: false, showZoom: false, showCopyright: false, pan: { enabled: false}});
    var o = board.create('text', [.5, -2.5, '<div class="lala" style="font-weight: bold">Exponent:&ThinSpace;</div><div id="lala" class="lala"><span><input checked type="radio" name="o" value="3"/>&ThinSpace;3</span><span><input type="radio" name="o" value="-3"/>&ThinSpace;-3</span><span><input type="radio" name="o" value="1/3"/>&ThinSpace;1/3</span></div>'], { anchorX: 'left', anchorY: 'bottom', fixed: true });
    o._value = [3, 1]; o.Value = () => o._value;
    o._values = "3"; o.Values = () => o._values;
    document.getElementById("lala").onchange = (e) => {
        switch (e.target.value) {
            case "3":
                o._value = [3, 1];
                break;
            case "-3":
                o._value = [-3, 1];
                break;
            case "1/3":
                o._value = [1, 3];
                break;
        }
        o._values = e.target.value;
        board.update();
    };

    var gf = (x) => s.Value() * JXG.Math.ratpow(x, o.Value()[0], o.Value()[1]);
    var ff = (x) => s.Value() * JXG.Math.ratpow(x-p.X(), o.Value()[0], o.Value()[1]) + p.Y();
    var t = () => "f(x) = " + s.Value()  + "\\cdot(x " + plusminus(-p.X()) + ")^{" + o._values + "} " + plusminus(p.Y());

    var p = board.create('point', [0, 0], {visible: true, name: 'P', snapToGrid: true, snapSizeX: .5, snapSizeY: .5});
    var s = board.create('slider', [[.5, -3], [2.5, -3], [-2, 1, 2]], {snapWidth: .5, name: 'a', digits: 1, label: {fontSize: 16, strokeColor: '#D55E00'}});
    var g = board.create('functiongraph', [gf], {strokeWidth: 1, dash: 2});
    var f = board.create('functiongraph', [ff], {strokeWidth: 3});

    var text = board.create('text', [.3, -4, () => {
        return t();
    }], {useKatex: true});
</script>

</body>
</html>
