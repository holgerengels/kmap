version: "3.8"

services:
  couchdb:
    image: couchdb:latest
    restart: unless-stopped
    volumes:
      - couchdb:/opt/couchdb/data
    networks:
      kmap:
        aliases:
          - couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: secret
    ports:
      - "127.0.0.1:5984:5984"

volumes:
  couchdb:

networks:
  kmap:

