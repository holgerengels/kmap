<!doctype html>
<html lang="de">
<head>
    <title>Sinus Zeichnen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraph.css'/>
    <script src='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraphcore.js' type='text/javascript'></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr;
            position: relative;
        }
        .jxgbox { border-radius: 0px; border: none}
        .term { background-color: white; }
        #lala {
            color: #D55E00;
            display: flex;
            align-items: center;
            font-size: 1.2em;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id='board' class='jxgbox' style='width: 100%; aspect-ratio: 8/3'></div>
</div>

<script type='text/javascript'>
    const board = JXG.JSXGraph.initBoard('board', {
        boundingbox: [-1, 1.5, 7, -1.5], axis: true,
        defaultAxes: {
            x: {
                ticks: {
                    minorTicks: 2,
                    ticksDistance: 1/2,
                    scale: Math.PI,
                    scaleSymbol: 'π',
                    insertTicks: false,
                    strokeColor: 'black',
                }
            }
        },
        showNavigation: false, showZoom: false, showCopyright: false, pan: { enabled: false}
    });
    var f = board.create('functiongraph', [(x) => Math.sin(x)], {strokeWidth: 3, strokeColor: JXG.palette.green});
    var g = board.create('functiongraph', [(x) => 0.5], {strokeWidth: 2});
    var a = board.create('point', [1/6 * Math.PI, .5], {size: 2, name: ""});
    var b = board.create('point', [5/6 * Math.PI, .5], {size: 2, name: ""});
</script>

</body>
</html>
