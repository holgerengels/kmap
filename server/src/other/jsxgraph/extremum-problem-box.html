<!doctype html>
<html lang="de">
<head>
    <title>Schachtelvolumen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraph.css'/>
    <script src='https://cdn.jsdelivr.net/npm/jsxgraph@latest/distrib/jsxgraphcore.js' type='text/javascript'></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr;
        }
        .jxgbox { border-radius: 0px; border: none}
        .term { background-color: white }
    </style>
</head>
<body>

<div class="container">
    <div id='board' class='jxgbox' style='width: 100%; min-width: 350px; max-width: 450px; aspect-ratio: 2'></div>
    <div id='model' class='jxgbox' style='width: 100%; min-width: 350px; max-width: 450px; aspect-ratio: 1'></div>
</div>

<script type='text/javascript'>
    const l = 21;
    const b = 21;
    let v = (x) => x*(b-2*x)*(l-2*x);

    var board = JXG.JSXGraph.initBoard('board', {boundingbox: [-1, 800, 11, -100], axis: true, showNavigation: false, showZoom: false, showCopyright: false, pan: { enabled: false}});
    var fv = board.create('functiongraph', [v, 0, 10.5], {strokeWidth: 3});
    var p1 = board.create('point', [0, 0], {visible: false, name: ''});
    var p2 = board.create('point', [10.5, 0], {visible: false, name: ''});
    var s = board.create('segment', [p1, p2], {visible: false, name: ''});
    var x1 = board.create('glider', [2, 0, s], {visible: true, name: 'x', showInfobox: false, label: {fontSize: 1.2, fontUnit: 'em', color: '#D55E00'}});
    var y1 = board.create('point', [() => x1.X(), () => v(x1.X())], {visible: true, name: '', color: '#0072B2'});
    var s1 = board.create('line', [x1, y1], {visible: true, name: '', dash: 2, strokeColor: 'darkgray'});
    var a = board.create('segment', [p1, x1], {visible: true, name: '', strokeColor: '#D55E00'});

    var model = JXG.JSXGraph.initBoard('model', { boundingbox: [-10, 8, 8, -8], keepaspectratio: false, axis: false, showNavigation: false, showZoom: false, showCopyright: false, pan: { enabled: false} });
    board.addChild(model);

    var view = model.create('view3d',
        [
            [-4, -3], [8, 8], // 2D box of view
            [[0, b], [0, l], [0, Math.ceil(b/2)]]   // 3D bounding cube
        ], {
            projection: 'central',
            axesPosition: 'none'
        }
        );

    var A = view.create('point3d', [() => x1.X(), () => x1.X(), 0], { size: 2, name: '', visible: true, fixed: true });
    var B = view.create('point3d', [() => b - x1.X(), () => x1.X(), 0], { size: 2, name: '', visible: true, fixed: true });
    var C = view.create('point3d', [() => b - x1.X(), () => l - x1.X(), 0], { size: 2, name: '', visible: true, fixed: true });
    var D = view.create('point3d', [() => x1.X(), () => l - x1.X(), 0], { size: 2, name: '', visible: true, fixed: true });
    var E = view.create('point3d', [() => x1.X(), () => x1.X(), () => x1.X()], { size: 2, name: '', visible: true, fixed: true });
    var F = view.create('point3d', [() => b - x1.X(), () => x1.X(), () => x1.X()], { size: 2, name: '', visible: true, fixed: true });
    var G = view.create('point3d', [() => b - x1.X(), () => l - x1.X(), () => x1.X()], { size: 2, name: '', visible: true, fixed: true });
    var H = view.create('point3d', [() => x1.X(), () => l - x1.X(), () => x1.X()], { size: 2, name: '', visible: true, fixed: true });

    view.create('polygon', [A.element2D, B.element2D, C.element2D, D.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 1 }});
    view.create('polygon', [E.element2D, F.element2D, G.element2D, H.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 1 }});
    view.create('polygon', [A.element2D, B.element2D, F.element2D, E.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 0 }});
    view.create('polygon', [B.element2D, C.element2D, G.element2D, F.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 1 }});
    view.create('polygon', [C.element2D, D.element2D, H.element2D, G.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 0 }});
    view.create('polygon', [D.element2D, A.element2D, E.element2D, H.element2D], { highlight: false, gradient: 'linear', gradientSecondColor: 'white', fillColor: 'blue', borders: { strokecolor: 'blue', strokeWidth: 0 }});

    var O = view.create('point3d', [0, 0, 0], { size: 2, name: '', visible: false, fixed: true });
    var X = view.create('point3d', [() => x1.X(), 0, 0], { size: 2, name: '', visible: false, fixed: true });
    var Y = view.create('point3d', [0, () => x1.X(), 0], { size: 2, name: '', visible: false, fixed: true });
    view.create('polygon', [O.element2D, X.element2D, A.element2D, Y.element2D], { highlight: false, fillColor: 'none', borders: { strokecolor: 'red', strokeWidth: 1 }});

    var O2 = view.create('point3d', [l, 0, 0], { size: 2, name: '', visible: false, fixed: true });
    var X2 = view.create('point3d', [() => l - x1.X(), 0, 0], { size: 2, name: '', visible: false, fixed: true });
    var Y2 = view.create('point3d', [l, () => x1.X(), 0], { size: 2, name: '', visible: false, fixed: true });
    view.create('polygon', [O2.element2D, X2.element2D, B.element2D, Y2.element2D], { highlight: false, fillColor: 'none', borders: { strokecolor: 'red', strokeWidth: 1 }});

    var O3 = view.create('point3d', [l, b, 0], { size: 2, name: '', visible: false, fixed: true });
    var X3 = view.create('point3d', [() => l - x1.X(), b, 0], { size: 2, name: '', visible: false, fixed: true });
    var Y3 = view.create('point3d', [l, () => b - x1.X(), 0], { size: 2, name: '', visible: false, fixed: true });
    view.create('polygon', [O3.element2D, X3.element2D, C.element2D, Y3.element2D], { highlight: false, fillColor: 'none', borders: { strokecolor: 'red', strokeWidth: 1 }});

    var O4 = view.create('point3d', [0, b, 0], { size: 2, name: '', visible: false, fixed: true });
    var X4 = view.create('point3d', [() => x1.X(), b, 0], { size: 2, name: '', visible: false, fixed: true });
    var Y4 = view.create('point3d', [0, () => b - x1.X(), 0], { size: 2, name: '', visible: false, fixed: true });
    view.create('polygon', [O4.element2D, X4.element2D, D.element2D, Y4.element2D], { highlight: false, fillColor: 'none', borders: { strokecolor: 'red', strokeWidth: 1 }});

</script>

</body>
</html>
